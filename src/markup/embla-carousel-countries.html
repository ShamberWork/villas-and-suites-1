<section class="corallium embla-carousel" aria-label="Выбор страны">
    <div class="travel-carousel-wrapper">
        <div class="embla">
            <div class="embla__viewport">
                <div class="embla__container">

                    <div class="embla__slide" role="group" aria-label="Турция">
                        <div class="embla__slide__inner">
                            <img src="/turkey.jpg" alt="Турция" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">Турция</span>
                            </div>
                        </div>
                    </div>

                    <div class="embla__slide" role="group" aria-label="Египет">
                        <div class="embla__slide__inner">
                            <img src="/egypt.jpg" alt="Египет" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">Египет</span>
                            </div>
                        </div>
                    </div>


                    <div class="embla__slide" role="group" aria-label="ОАЭ">
                        <div class="embla__slide__inner">
                            <img src="/uae.jpg" alt="ОАЭ" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">ОАЭ</span>
                            </div>
                        </div>
                    </div>

                    <div class="embla__slide" role="group" aria-label="Мальдивы">
                        <div class="embla__slide__inner">
                            <img src="/maldives.jpg" alt="Мальдивы" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">Мальдивы</span>
                            </div>
                        </div>
                    </div>

                    <div class="embla__slide" role="group" aria-label="Таиланд">
                        <div class="embla__slide__inner">
                            <img src="/thailand.jpg" alt="Таиланд" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">Таиланд</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="embla__pagination"></div>

        <div class="embla__navigation">
            <button class="embla__btn embla__btn--prev" type="button" aria-label="Предыдущая страна">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="embla__btn embla__btn--next" type="button" aria-label="Следующая страна">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>
    </div>
</section>
