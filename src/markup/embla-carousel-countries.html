<section class="corallium embla-carousel" aria-label="Выбор страны" aria-roledescription="карусель">
    <div class="travel-carousel-wrapper">
        <div class="embla">
            <div class="embla__viewport">
                <div class="embla__container">
                    <div class="embla__slide" role="group" aria-label="1 из 5 — Таиланд" aria-roledescription="слайд">
                        <div class="embla__slide__inner">
                            <img src="/thailand.jpg" alt="Большой Будда на Пхукете, Таиланд" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">Таиланд</span>
                            </div>
                        </div>
                    </div>

                    <div class="embla__slide is-active" role="group" aria-label="2 из 5 — Турция" aria-roledescription="слайд" aria-current="true">
                        <div class="embla__slide__inner">
                            <img src="/turkey.jpg" alt="Воздушные шары над Каппадокией, Турция" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">Турция</span>
                            </div>
                        </div>
                    </div>

                    <div class="embla__slide" role="group" aria-label="3 из 5 — Египет" aria-roledescription="слайд">
                        <div class="embla__slide__inner">
                            <img src="/egypt.jpg" alt="Пирамиды Египта" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">Египет</span>
                            </div>
                        </div>
                    </div>

                    <div class="embla__slide" role="group" aria-label="4 из 5 — ОАЭ" aria-roledescription="слайд">
                        <div class="embla__slide__inner">
                            <img src="/uae.jpg" alt="Бурдж-Халифа, ОАЭ" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">ОАЭ</span>
                            </div>
                        </div>
                    </div>

                    <div class="embla__slide" role="group" aria-label="5 из 5 — Мальдивы" aria-roledescription="слайд">
                        <div class="embla__slide__inner">
                            <img src="/maldives.jpg" alt="Побережье Мальдив" class="embla__slide__img">
                            <div class="embla__slide__overlay">
                                <span class="embla__slide__title">Мальдивы</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="embla__pagination" aria-label="Навигация по странам"></div>

        <div class="embla__controls" aria-label="Переключение стран">
            <button class="embla__button embla__button--prev" type="button" aria-label="Предыдущая страна">
                <img class="embla__button-disc" src="/carousel-arrow-disc.svg" alt="">
                <img class="embla__button-icon" src="/carousel-arrow-chevron.svg" alt="">
            </button>
            <button class="embla__button embla__button--next" type="button" aria-label="Следующая страна">
                <img class="embla__button-disc" src="/carousel-arrow-disc.svg" alt="">
                <img class="embla__button-icon" src="/carousel-arrow-chevron.svg" alt="">
            </button>
        </div>
    </div>
</section>
